name: Build and publish desktop updates

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: Optional upstream branch, tag, or commit
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Check out the packager
        uses: actions/checkout@v7

      - name: Use Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Resolve desktop and DSH release inputs
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
        run: |
          $ErrorActionPreference = 'Stop'
          $desktopManifest = Get-Content -LiteralPath 'overlay/apps/desktop/package.json' -Raw | ConvertFrom-Json
          $baseVersion = [string]$desktopManifest.version
          $baseMatch = [regex]::Match($baseVersion, '^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)$')
          if (-not $baseMatch.Success) {
            throw "The overlay desktop version must be stable major.minor.patch SemVer, got $baseVersion."
          }

          $upstreamPath = Join-Path $env:RUNNER_TEMP 'deepseek-harness-version'
          git clone --filter=blob:none --no-checkout https://github.com/deepseek-ai/deepseek-harness.git $upstreamPath
          git -C $upstreamPath fetch --force --tags origin
          $requestedRef = $env:REQUESTED_REF
          if ([string]::IsNullOrWhiteSpace($requestedRef)) {
            $requestedRef = 'origin/HEAD'
          }
          $upstreamCommit = (git -C $upstreamPath rev-parse --verify "${requestedRef}^{commit}").Trim()
          $upstreamManifest = (git -C $upstreamPath show "${upstreamCommit}:package.json" | Out-String | ConvertFrom-Json)
          $upstreamVersion = [string]$upstreamManifest.version
          if ([string]::IsNullOrWhiteSpace($upstreamVersion)) {
            throw 'The upstream package.json has no version.'
          }

          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $major = [int]$baseMatch.Groups['major'].Value
          $minor = [int]$baseMatch.Groups['minor'].Value
          $basePatch = [int]$baseMatch.Groups['patch'].Value
          $tagPattern = "^v$major\.$minor\.(?<patch>\d+)$"
          $releasesUri = 'https://api.github.com/repos/${{ github.repository }}/releases?per_page=100'
          $releases = Invoke-RestMethod -Uri $releasesUri -Headers $headers -Method Get
          $candidates = @(
            foreach ($existingRelease in $releases) {
              if ($existingRelease.draft -eq $true) { continue }
              $tagMatch = [regex]::Match([string]$existingRelease.tag_name, $tagPattern)
              if (-not $tagMatch.Success) { continue }
              [pscustomobject]@{
                patch = [int]$tagMatch.Groups['patch'].Value
                release = $existingRelease
              }
            }
          )
          $latest = $candidates | Sort-Object patch -Descending | Select-Object -First 1
          $needsRelease = $true
          $desktopVersion = $baseVersion
          if ($null -ne $latest) {
            $body = [string]$latest.release.body
            $sameDesktopSource = [string]$latest.release.target_commitish -eq '${{ github.sha }}'
            $sameDshSource = $body.Contains("DSH source: $upstreamCommit")
            if ($sameDesktopSource -and $sameDshSource) {
              $needsRelease = $false
              $desktopVersion = ([string]$latest.release.tag_name).TrimStart('v')
            } else {
              $nextPatch = [Math]::Max($basePatch, $latest.patch + 1)
              $desktopVersion = "$major.$minor.$nextPatch"
            }
          }
          $tag = "v$desktopVersion"
          "desktop_version=$desktopVersion" >> $env:GITHUB_OUTPUT
          "dsh_version=$upstreamVersion" >> $env:GITHUB_OUTPUT
          "needs_release=$($needsRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "upstream_commit=$upstreamCommit" >> $env:GITHUB_OUTPUT

      - name: Build installer and update metadata
        if: steps.release.outputs.needs_release == 'true'
        shell: powershell
        run: .\scripts\build.ps1 -UpstreamRef '${{ steps.release.outputs.upstream_commit }}' -DesktopVersion '${{ steps.release.outputs.desktop_version }}'

      - name: Publish GitHub Release
        if: steps.release.outputs.needs_release == 'true'
        shell: pwsh
        env:
          DESKTOP_VERSION: ${{ steps.release.outputs.desktop_version }}
          DSH_VERSION: ${{ steps.release.outputs.dsh_version }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          UPSTREAM_COMMIT: ${{ steps.release.outputs.upstream_commit }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem -LiteralPath dist -File -Filter "DeepSeek-Harness-Setup-$env:DESKTOP_VERSION-x64.exe")
          if ($installers.Count -ne 1) {
            throw "Expected one installer for desktop $env:DESKTOP_VERSION, found $($installers.Count)."
          }
          $installer = $installers[0]
          $blockmap = Get-Item -LiteralPath "$($installer.FullName).blockmap"
          $updateManifest = Get-Item -LiteralPath 'dist\latest.yml'
          $buildManifest = Get-Item -LiteralPath "dist\DeepSeek-Harness-Setup-$env:DESKTOP_VERSION-x64.json"
          $assets = @($installer.FullName, $blockmap.FullName, $updateManifest.FullName, $buildManifest.FullName)
          $notes = "Windows x64 desktop package.`n`nBundled DSH version: $env:DSH_VERSION`nDSH source: $env:UPSTREAM_COMMIT`nDesktop source: ${{ github.sha }}"
          $arguments = @(
            'release', 'create', $env:RELEASE_TAG,
            '--repo', '${{ github.repository }}',
            '--target', '${{ github.sha }}',
            '--title', "DeepSeek Harness Desktop $env:DESKTOP_VERSION",
            '--notes', $notes,
            '--latest'
          )
          $arguments += $assets
          gh @arguments

      - name: Report an unchanged release
        if: steps.release.outputs.needs_release != 'true'
        shell: pwsh
        run: Write-Host 'Desktop source and bundled DSH source are unchanged; no release is needed.'
